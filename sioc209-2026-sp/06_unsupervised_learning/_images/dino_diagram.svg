<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 11px; fill: #666; }
    .stopgrad { font-size: 12px; fill: #c62828; font-weight: 600; }
    .ema { font-size: 11px; fill: #6a1b9a; font-weight: 600; }
    .student { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; }
    .teacher { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1.5; }
    .softmax { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .loss { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 1.5; }
    .arr { stroke: #333; stroke-width: 1.5; fill: none; }
    .arrEma { stroke: #6a1b9a; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#333"/>
    </marker>
    <marker id="arP" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#6a1b9a"/>
    </marker>
  </defs>

  <!-- image -->
  <rect x="20" y="115" width="55" height="55" rx="3" fill="#f5f5f5" stroke="#888"/>
  <text x="47.5" y="148" text-anchor="middle">image</text>

  <!-- student branch (top) -->
  <path d="M 75 135 Q 100 90, 125 75" class="arr" marker-end="url(#ar)"/>
  <text x="135" y="72" class="label">view 1</text>
  <line x1="180" y1="70" x2="210" y2="70" class="arr" marker-end="url(#ar)"/>
  <rect x="215" y="50" width="105" height="40" rx="3" class="student"/>
  <text x="267.5" y="75" text-anchor="middle">student gθ</text>
  <line x1="320" y1="70" x2="355" y2="70" class="arr" marker-end="url(#ar)"/>
  <rect x="360" y="50" width="105" height="40" rx="3" class="softmax"/>
  <text x="412.5" y="75" text-anchor="middle">softmax(τₛ)</text>
  <line x1="465" y1="70" x2="510" y2="70" class="arr" marker-end="url(#ar)"/>
  <text x="500" y="60" class="label">p_s</text>

  <!-- teacher branch (bottom) -->
  <path d="M 75 150 Q 100 195, 125 210" class="arr" marker-end="url(#ar)"/>
  <text x="135" y="227" class="label">view 2</text>
  <line x1="180" y1="210" x2="210" y2="210" class="arr" marker-end="url(#ar)"/>
  <rect x="215" y="190" width="105" height="40" rx="3" class="teacher"/>
  <text x="267.5" y="215" text-anchor="middle">teacher gξ</text>
  <line x1="320" y1="210" x2="355" y2="210" class="arr" marker-end="url(#ar)"/>
  <rect x="360" y="188" width="105" height="44" rx="3" class="softmax"/>
  <text x="412.5" y="206" text-anchor="middle">center,</text>
  <text x="412.5" y="222" text-anchor="middle">softmax(τₜ)</text>
  <line x1="465" y1="210" x2="510" y2="210" class="arr" marker-end="url(#ar)"/>
  <text x="500" y="228" class="label">p_t</text>
  <!-- stop-grad -->
  <line x1="470" y1="193" x2="470" y2="227" stroke="#c62828" stroke-width="3"/>
  <line x1="466" y1="193" x2="474" y2="193" stroke="#c62828" stroke-width="3"/>
  <line x1="466" y1="227" x2="474" y2="227" stroke="#c62828" stroke-width="3"/>
  <text x="480" y="248" class="stopgrad">stop-grad</text>

  <!-- EMA arrow from student to teacher -->
  <path d="M 267 90 C 175 130, 175 165, 267 190" class="arrEma" marker-end="url(#arP)"/>
  <text x="155" y="140" class="ema">ξ ← EMA(θ)</text>

  <!-- Loss -->
  <line x1="525" y1="80" x2="595" y2="130" class="arr" marker-end="url(#ar)"/>
  <line x1="525" y1="200" x2="595" y2="150" class="arr" marker-end="url(#ar)"/>
  <rect x="600" y="120" width="140" height="40" rx="3" class="loss"/>
  <text x="670" y="145" text-anchor="middle">−p_t · log p_s</text>

  <text x="670" y="178" text-anchor="middle" class="small">(cross-entropy)</text>
</svg>
