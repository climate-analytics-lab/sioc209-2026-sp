<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 11px; fill: #666; }
    .encoder { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; }
    .decoder { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .loss { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 1.5; }
    .visible { fill: #fafafa; stroke: #555; stroke-width: 1; }
    .masked { fill: #424242; stroke: #424242; stroke-width: 1; }
    .recon { fill: #e8f5e9; stroke: #4caf50; stroke-width: 1.5; }
    .arr { stroke: #333; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#333"/>
    </marker>
  </defs>

  <!-- input patch grid (4x4) -->
  <g transform="translate(20,75)">
    <rect x="0"   y="0"   width="25" height="25" class="masked"/>
    <rect x="25"  y="0"   width="25" height="25" class="visible"/>
    <rect x="50"  y="0"   width="25" height="25" class="masked"/>
    <rect x="75"  y="0"   width="25" height="25" class="visible"/>
    <rect x="0"   y="25"  width="25" height="25" class="visible"/>
    <rect x="25"  y="25"  width="25" height="25" class="masked"/>
    <rect x="50"  y="25"  width="25" height="25" class="masked"/>
    <rect x="75"  y="25"  width="25" height="25" class="masked"/>
    <rect x="0"   y="50"  width="25" height="25" class="masked"/>
    <rect x="25"  y="50"  width="25" height="25" class="masked"/>
    <rect x="50"  y="50"  width="25" height="25" class="visible"/>
    <rect x="75"  y="50"  width="25" height="25" class="masked"/>
    <rect x="0"   y="75"  width="25" height="25" class="masked"/>
    <rect x="25"  y="75"  width="25" height="25" class="masked"/>
    <rect x="50"  y="75"  width="25" height="25" class="masked"/>
    <rect x="75"  y="75"  width="25" height="25" class="visible"/>
  </g>
  <text x="70" y="200" text-anchor="middle">input (≈75% masked)</text>

  <!-- arrow to encoder -->
  <line x1="125" y1="125" x2="170" y2="125" class="arr" marker-end="url(#ar)"/>
  <text x="147" y="115" text-anchor="middle" class="small">visible only</text>

  <!-- encoder -->
  <rect x="175" y="100" width="120" height="50" rx="3" class="encoder"/>
  <text x="235" y="123" text-anchor="middle">ViT encoder</text>
  <text x="235" y="140" text-anchor="middle" class="small">(large)</text>

  <!-- + mask tokens -->
  <line x1="295" y1="125" x2="350" y2="125" class="arr" marker-end="url(#ar)"/>
  <text x="322" y="115" text-anchor="middle" class="small">+ [mask] tokens</text>

  <!-- decoder -->
  <rect x="355" y="100" width="120" height="50" rx="3" class="decoder"/>
  <text x="415" y="123" text-anchor="middle">decoder</text>
  <text x="415" y="140" text-anchor="middle" class="small">(lightweight)</text>

  <!-- arrow to reconstruction -->
  <line x1="475" y1="125" x2="515" y2="125" class="arr" marker-end="url(#ar)"/>

  <!-- reconstructed image -->
  <g transform="translate(520,75)">
    <rect x="0" y="0" width="100" height="100" class="recon"/>
    <text x="50" y="50" text-anchor="middle" font-size="12">reconstructed</text>
    <text x="50" y="66" text-anchor="middle" font-size="12">pixels</text>
  </g>

  <!-- loss -->
  <line x1="625" y1="125" x2="665" y2="125" class="arr" marker-end="url(#ar)"/>
  <rect x="670" y="100" width="90" height="50" rx="3" class="loss"/>
  <text x="715" y="120" text-anchor="middle">MSE</text>
  <text x="715" y="138" text-anchor="middle" class="small">on masked patches</text>

  <!-- legend -->
  <rect x="20" y="235" width="14" height="14" class="visible"/>
  <text x="40" y="247" class="small">visible patch</text>
  <rect x="140" y="235" width="14" height="14" class="masked"/>
  <text x="160" y="247" class="small">masked patch</text>
</svg>
