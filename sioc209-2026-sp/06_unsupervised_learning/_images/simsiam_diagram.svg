<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .small { font-size: 11px; fill: #666; }
    .stopgrad { font-size: 12px; fill: #c62828; font-weight: 600; }
    .encoder { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; }
    .head { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; }
    .loss { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 1.5; }
    .arr { stroke: #333; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L0,10 L10,5 z" fill="#333"/>
    </marker>
  </defs>

  <!-- image -->
  <rect x="20" y="105" width="55" height="55" rx="3" fill="#f5f5f5" stroke="#888"/>
  <text x="47.5" y="138" text-anchor="middle">image</text>
  <text x="47.5" y="180" text-anchor="middle" class="small">augment</text>

  <!-- top branch -->
  <path d="M 75 125 Q 100 80, 125 65" class="arr" marker-end="url(#ar)"/>
  <text x="135" y="62" class="label">x₁</text>
  <line x1="160" y1="60" x2="195" y2="60" class="arr" marker-end="url(#ar)"/>
  <rect x="200" y="40" width="100" height="40" rx="3" class="encoder"/>
  <text x="250" y="65" text-anchor="middle">encoder f</text>
  <line x1="300" y1="60" x2="340" y2="60" class="arr" marker-end="url(#ar)"/>
  <text x="335" y="50" class="small">z₁</text>
  <rect x="345" y="40" width="100" height="40" rx="3" class="head"/>
  <text x="395" y="65" text-anchor="middle">predictor h</text>
  <line x1="445" y1="60" x2="495" y2="60" class="arr" marker-end="url(#ar)"/>
  <text x="490" y="50" class="label">p₁</text>

  <!-- bottom branch -->
  <path d="M 75 140 Q 100 190, 125 205" class="arr" marker-end="url(#ar)"/>
  <text x="135" y="222" class="label">x₂</text>
  <line x1="160" y1="205" x2="195" y2="205" class="arr" marker-end="url(#ar)"/>
  <rect x="200" y="185" width="100" height="40" rx="3" class="encoder"/>
  <text x="250" y="210" text-anchor="middle">encoder f</text>
  <line x1="300" y1="205" x2="340" y2="205" class="arr" marker-end="url(#ar)"/>
  <text x="335" y="222" class="small">z₂</text>

  <!-- stop-gradient barrier -->
  <line x1="350" y1="188" x2="350" y2="222" stroke="#c62828" stroke-width="3"/>
  <line x1="346" y1="188" x2="354" y2="188" stroke="#c62828" stroke-width="3"/>
  <line x1="346" y1="222" x2="354" y2="222" stroke="#c62828" stroke-width="3"/>
  <text x="360" y="212" class="stopgrad">stop-grad</text>

  <!-- shared weights -->
  <line x1="250" y1="80" x2="250" y2="185" stroke="#999" stroke-dasharray="4,3"/>
  <text x="258" y="138" class="small">weights shared</text>

  <!-- loss combination -->
  <line x1="520" y1="70" x2="585" y2="120" class="arr" marker-end="url(#ar)"/>
  <line x1="420" y1="205" x2="585" y2="145" class="arr" marker-end="url(#ar)"/>
  <rect x="590" y="110" width="155" height="42" rx="3" class="loss"/>
  <text x="667" y="136" text-anchor="middle">−cos(p₁, sg(z₂))</text>

  <text x="667" y="175" text-anchor="middle" class="small">+ symmetric term (swap branches)</text>
</svg>
